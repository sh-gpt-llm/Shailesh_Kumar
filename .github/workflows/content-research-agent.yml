name: Content Research Agent

# Runs weekly and on-demand. Researches a rotating theme, drafts a full
# article using an AI model with live web search, and commits it as a DRAFT
# (draft: true in the post's frontmatter) for human review in /admin before
# it can ever appear on the live site.

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 08:00 UTC
  workflow_dispatch: {} # Lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate-draft:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Research and draft a new article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/content-agent.mjs

      - name: Commit and push the new draft
        run: |
          git config user.name "content-research-agent"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/writing scripts/.content-agent-state.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Add AI-researched draft article (auto-generated, requires review)"
          git push
