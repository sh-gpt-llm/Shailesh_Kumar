# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: sh-gpt-llm/Shailesh_Kumar
  branch: main

# Sign in with a GitHub Personal Access Token (Settings > Developer settings >
# Personal access tokens > Fine-grained tokens, scoped to this repo, Contents:
# Read and write). Click "Sign In with Token" on the /admin login screen.
# This admin panel lets you create, edit, and delete posts with a rich
# markdown editor — no code required.

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "writing"
    label: "Writing (Blog / Research / Patterns / Architecture / Strategy)"
    folder: "src/content/writing"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description (short summary shown on cards)", name: "description", widget: "text" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Blog", "Research", "Pattern", "Architecture", "Strategy", "Consulting"]
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Cover Image", name: "cover", widget: "image", required: false }
      - { label: "Feature this post on the homepage", name: "featured", widget: "boolean", default: false }
      - { label: "Draft (hide from the live site)", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
